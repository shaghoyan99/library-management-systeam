<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background-color: #fff;
            border: 2px solid #999;
            padding: 20px;
            box-sizing: border-box;
        }


        .navbar a {
            text-decoration: none;
            color: #000;
            font-weight: 500;
        }

        .title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            border: 1px solid #555;
            background-color: #eee;
            cursor: pointer;
        }

        .buttons button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
<span th:if="${msg} != null">
    <span style="color: red" th:text="${msg}"> </span>
</span>
<div class="navbar">
    <span th:if="${user} != null"> Welcome <span th:text="${user.getName() + ' ' + user.getSurname()}"></span></span>
    <img th:if="${user.getPictureName() != null && !user.getPictureName().equals('')}" th:src="@{/image/get(pic=${user.pictureName})}" width="50">
    <img th:if="${user.getPictureName() == null || user.getPictureName().equals('')}" th:src="@{/images/img.jpeg}" width="50">
    <a th:if="${user}  != null" href="/logout">Logout</a> <br><br>
    <a th:if="${user}  == null" href="/login">Login</a> <br><br>
    <a th:if="${user}  == null" href="/registerPage">Register</a> <br><br>
</div>

<div class="container">
    <div class="title">Library Management System</div>

    <div class="buttons">
        <button><a href="/books">Books</a></button>
        <button><a href="/categories">Categories</a></button>
        <button><a href="/members">Members</a></button>
    </div>
</div>
</body>
</html>
